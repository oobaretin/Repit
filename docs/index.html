<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Repit — a mindfulness repetition timer for iOS." />
    <meta name="theme-color" content="#060912" />
    <title>Repit — Mindfulness Repetition Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #060912;
        --surface: #0e1826;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #22d3ee;
        --border: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(ellipse at top, #0e1826 0%, var(--bg) 55%);
        color: var(--text);
        line-height: 1.65;
        min-height: 100vh;
      }

      main {
        max-width: 36rem;
        margin: 0 auto;
        min-height: 100vh;
        padding: 4rem 1.25rem 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .mark {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 8px 32px rgba(34, 211, 238, 0.18);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 0 0 2rem;
        color: var(--muted);
        font-size: 1.05rem;
      }

      p.pitch {
        color: #d1d5db;
        font-size: 0.98rem;
        max-width: 30rem;
      }

      .ring {
        width: 6.5rem;
        height: 6.5rem;
        margin: 1rem 0 2.5rem;
        border-radius: 50%;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        opacity: 0.9;
      }

      footer {
        margin-top: auto;
        padding-top: 2.5rem;
        font-size: 0.85rem;
        color: var(--muted);
      }

      footer a {
        color: var(--accent);
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="icon.svg" alt="Repit icon" width="72" height="72" />
      <h1>Repit</h1>
      <p class="subtitle">Mindfulness repetition timer for iOS</p>

      <div class="ring" aria-hidden="true"></div>

      <p class="pitch">
        Repit counts your mantra, breath, or exercise reps with a calm circular timer, gentle
        sound and haptic cues, and a distraction-free focus lock — all stored privately on your
        device.
      </p>

      <footer>
        <a href="privacy.html">Privacy Policy</a>
      </footer>
    </main>
  </body>
</html>
